[project]
name = "altium-helper"
version = "0.1.0"
description = "Read-only access to Altium 365 board designs and their history, for Claude and other MCP clients"
readme = "README.md"
requires-python = ">=3.10"
authors = [{ name = "Penn Electric Racing" }]
dependencies = [
    "mcp>=2.2,<3",
    "nodejs-wheel-binaries>=22",
    "olefile>=0.47",
]

[project.scripts]
altium-helper = "altium_helper.cli:main"

[dependency-groups]
dev = [
    "black>=25",
    "isort>=6",
    "pytest>=8",
]

[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/altium_helper"]

# black and isort with default settings, as in the firmware repo's pre-commit.
[tool.black]
target-version = ["py310"]

[tool.isort]
profile = "black"

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["network: downloads public test boards or npm packages"]
